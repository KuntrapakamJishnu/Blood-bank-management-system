version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: bloodbank-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bloodbank-backend
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/bloodbank
      - JWT_SECRET=change-me-in-production
      - CLIENT_URL=http://localhost:5173
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
      dockerfile: DockerFile
    container_name: bloodbank-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  mongo_data:
